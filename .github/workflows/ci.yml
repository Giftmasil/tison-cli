name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Smoke test the CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js list
          node dist/cli.js run enterprise --output "$RUNNER_TEMP/ci-test"
          test -f "$RUNNER_TEMP/ci-test/AGENTS.md"
          test -f "$RUNNER_TEMP/ci-test/.claude/agents/code-reviewer.md"
          node dist/cli.js validate "$RUNNER_TEMP/ci-test"
      - name: The AI commands must not need a key to refuse politely
        run: |
          node dist/cli.js doctor --offline || true
          node dist/cli.js fill "$RUNNER_TEMP/ci-test" --dry-run
      - name: Verify the package still ships templates + dist, and no tests
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "templates/enterprise/AGENTS.md" /tmp/pack.txt
          grep -q "dist/cli.js" /tmp/pack.txt
          ! grep -qE "dist-test|\.test\.js" /tmp/pack.txt
