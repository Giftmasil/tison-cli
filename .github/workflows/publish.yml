name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets npm verify this build via OIDC (trusted publishing + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # No NPM_TOKEN needed: configure this repo as a Trusted Publisher on npm
      # (npmjs.com -> package settings -> Trusted Publishing). OIDC handles auth.
      - run: npm publish --provenance --access public